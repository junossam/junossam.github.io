<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8-퍼즐 탐색 시각화</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f7f2, #151719);
      --surface: light-dark(#fffef8, #22262a);
      --surface-2: light-dark(#eef6ff, #1f2933);
      --text: light-dark(#232521, #f1f4ee);
      --muted: light-dark(#656b60, #b3baac);
      --line: light-dark(#d3d9cd, #3d444b);
      --accent: light-dark(#0b6fcb, #60a5fa);
      --accent-2: light-dark(#b45309, #fbbf24);
      --good: light-dark(#15803d, #86efac);
      --bad: light-dark(#b42318, #fb7185);
      --tile: light-dark(#ffffff, #2c333a);
      --blank: light-dark(#dbe4ea, #171b1f);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, light-dark(rgba(11, 111, 203, .14), rgba(96, 165, 250, .10)), transparent 30rem),
        linear-gradient(145deg, var(--bg), light-dark(#eef1ea, #101214));
      color: var(--text);
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.45rem, 2.8vw, 2.25rem);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 760px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 460px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .10);
    }

    .control-panel,
    .eval-panel {
      padding: 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 8px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }

    .btn.primary,
    .btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: light-dark(#ffffff, #08111d);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat {
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 8px;
      padding: 10px;
      min-width: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 4px;
    }

    .stat-value {
      font-weight: 800;
      font-size: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
      margin-bottom: 16px;
    }

    .board-wrap h2 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .puzzle {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(100%, 220px);
      aspect-ratio: 1;
    }

    .tile {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--tile);
      color: var(--text);
      display: grid;
      place-items: center;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 900;
      aspect-ratio: 1;
    }

    .tile.blank {
      background: var(--blank);
      color: transparent;
      border-style: dashed;
    }

    .tile.correct {
      border-color: var(--good);
      background: color-mix(in srgb, var(--good) 16%, var(--tile));
    }

    .message {
      min-height: 30px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }

    .eval-panel h2 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .eval-panel p {
      margin: 0 0 10px;
      color: var(--muted);
    }

    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .candidate-section {
      margin-bottom: 18px;
    }

    .candidate-grid > .candidate-section {
      grid-column: 1 / -1;
    }

    .candidate-section:last-child {
      margin-bottom: 0;
    }

    .candidate-section h3 {
      margin: 0 0 8px;
      font-size: .95rem;
    }

    .candidate-section-note {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: .88rem;
    }

    .candidate {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      padding: 8px;
      min-width: 0;
    }

    .candidate.chosen {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
    }

    .candidate.frontier-choice {
      border-color: var(--accent-2);
      background: color-mix(in srgb, var(--accent-2) 12%, var(--surface));
    }

    .candidate.rejected {
      opacity: .64;
    }

    .candidate-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      font-size: .88rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .mini-puzzle {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(100%, 220px);
      aspect-ratio: 1;
      margin: 0 auto;
    }

    .mini-puzzle span {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--tile);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
    }

    .mini-puzzle span.blank {
      background: var(--blank);
      color: transparent;
      border-style: dashed;
    }

    .mini-puzzle span.correct {
      border-color: var(--good);
      background: color-mix(in srgb, var(--good) 16%, var(--tile));
    }

    .candidate-meta {
      display: grid;
      gap: 2px;
      margin-top: 6px;
      color: var(--muted);
      font-size: .8rem;
    }

    .bar {
      height: 7px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
      margin-top: 6px;
    }

    .bar span {
      display: block;
      height: 100%;
      width: var(--score-width, 0%);
      background: var(--good);
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 20px, 1200px);
        padding-top: 18px;
      }

      .topbar,
      .boards {
        display: block;
      }

      .status,
      .candidate-grid {
        grid-template-columns: 1fr;
      }

      .puzzle {
        margin-bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <h1>8-퍼즐 탐색 시각화</h1>
        <p class="subtitle">언덕 등반과 최상 우선은 목표 상태와 같은 위치의 타일 수를 평가합니다. A*는 이동 횟수와 틀린 블록 수를 더한 값을 낮추는 방향으로 탐색합니다.</p>
      </div>
      <button class="btn" id="resetBtn" type="button">새 문제</button>
    </div>

    <div class="layout">
      <section class="panel control-panel">
        <div class="controls" aria-label="탐색 방식 선택">
          <button class="btn primary" id="hillBtn" type="button" aria-pressed="true">언덕 등반 탐색</button>
          <button class="btn" id="bestBtn" type="button" aria-pressed="false">최상 우선 탐색</button>
          <button class="btn" id="astarBtn" type="button" aria-pressed="false">A* 탐색</button>
        </div>
        <div class="controls">
          <button class="btn primary" id="runBtn" type="button">탐색 실행</button>
          <button class="btn" id="stepBtn" type="button" disabled>한 단계 보기</button>
        </div>

        <div class="status">
          <div class="stat">
            <div class="stat-label">평가값</div>
            <div class="stat-value" id="scoreText">0 / 8</div>
          </div>
          <div class="stat">
            <div class="stat-label">확장 수</div>
            <div class="stat-value" id="expandedText">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">상태</div>
            <div class="stat-value" id="stateText">대기</div>
          </div>
        </div>

        <div class="boards">
          <div class="board-wrap">
            <h2>현재 상태</h2>
            <div class="puzzle" id="currentBoard"></div>
          </div>
          <div class="board-wrap">
            <h2>목표 상태</h2>
            <div class="puzzle" id="goalBoard"></div>
          </div>
        </div>

        <div class="message" id="message">탐색 방식을 선택하고 실행하세요.</div>

      </section>

      <section class="panel eval-panel">
        <h2>다음 상태 평가</h2>
        <p id="reasonText">현재 상태에서 움직일 수 있는 후보가 여기에 표시됩니다.</p>
        <div class="candidate-grid" id="candidateGrid"></div>
      </section>
    </div>
  </main>

  <script>
    const GOAL = [1, 2, 3, 4, 5, 6, 7, 8, 0];
    const MOVES = [
      { name: "위", delta: -3 },
      { name: "아래", delta: 3 },
      { name: "왼쪽", delta: -1 },
      { name: "오른쪽", delta: 1 }
    ];

    const state = {
      mode: "hill",
      start: [2, 8, 3, 1, 6, 4, 7, 0, 5],
      current: [],
      goal: GOAL,
      steps: [],
      stepIndex: 0,
      root: null
    };

    const currentBoard = document.getElementById("currentBoard");
    const goalBoard = document.getElementById("goalBoard");
    const scoreText = document.getElementById("scoreText");
    const expandedText = document.getElementById("expandedText");
    const stateText = document.getElementById("stateText");
    const message = document.getElementById("message");
    const reasonText = document.getElementById("reasonText");
    const candidateGrid = document.getElementById("candidateGrid");
    const hillBtn = document.getElementById("hillBtn");
    const bestBtn = document.getElementById("bestBtn");
    const astarBtn = document.getElementById("astarBtn");
    const runBtn = document.getElementById("runBtn");
    const stepBtn = document.getElementById("stepBtn");
    const resetBtn = document.getElementById("resetBtn");

    function keyOf(board) {
      return board.join(",");
    }

    function score(board) {
      return board.reduce((sum, value, index) => value !== 0 && value === GOAL[index] ? sum + 1 : sum, 0);
    }

    function mismatch(board) {
      return 8 - score(board);
    }

    function astarValue(board, depth) {
      return depth + mismatch(board);
    }

    function canMove(blank, move) {
      if (move.name === "왼쪽" && blank % 3 === 0) return false;
      if (move.name === "오른쪽" && blank % 3 === 2) return false;
      const target = blank + move.delta;
      return target >= 0 && target < 9;
    }

    function neighbors(board) {
      const blank = board.indexOf(0);
      return MOVES.filter(move => canMove(blank, move)).map((move, order) => {
        const target = blank + move.delta;
        const next = board.slice();
        next[blank] = next[target];
        next[target] = 0;
        return {
          move: move.name,
          order,
          board: next,
          score: score(next),
          mismatch: mismatch(next),
          key: keyOf(next)
        };
      }).sort((a, b) => b.score - a.score || a.mismatch - b.mismatch || a.move.localeCompare(b.move, "ko"));
    }

    function astarNeighbors(board, parentBoard = null) {
      const parentKey = parentBoard ? keyOf(parentBoard) : null;
      return neighbors(board)
        .filter(item => item.key !== parentKey)
        .sort((a, b) => a.order - b.order);
    }

    function isGoal(board) {
      return keyOf(board) === keyOf(GOAL);
    }

    function inversionCount(board) {
      const values = board.filter(Boolean);
      let count = 0;
      for (let i = 0; i < values.length; i += 1) {
        for (let j = i + 1; j < values.length; j += 1) {
          if (values[i] > values[j]) count += 1;
        }
      }
      return count;
    }

    function isSolvable(board) {
      return inversionCount(board) % 2 === 0;
    }

    function shuffledBoard() {
      const board = GOAL.slice();
      for (let i = 0; i < 34; i += 1) {
        const opts = neighbors(board);
        const pick = opts[Math.floor(Math.random() * opts.length)];
        board.splice(0, board.length, ...pick.board);
      }
      return keyOf(board) === keyOf(GOAL) ? [1, 2, 3, 4, 0, 6, 7, 5, 8] : board;
    }

    function makeNode(board, depth, move, parentId) {
      return {
        id: parentId ? `${parentId}-${move}-${depth}-${keyOf(board).replaceAll(",", "")}` : "root",
        parentId,
        board,
        depth,
        move,
        score: score(board),
        mismatch: mismatch(board),
        astar: astarValue(board, depth),
        children: [],
        chosenChildId: null,
        expanded: false,
        frontierSize: 0,
        status: isGoal(board) ? "goal" : "open"
      };
    }

    function runHillClimbing(start) {
      const root = makeNode(start, 0, "시작", null);
      const steps = [];
      const visited = new Set([keyOf(start)]);
      let node = root;
      let expansions = 0;

      while (expansions < 80) {
        const currentScore = node.score;
        const options = neighbors(node.board).filter(item => !visited.has(item.key));
        node.expanded = true;
        node.children = options.map(option => makeNode(option.board, node.depth + 1, option.move, node.id));
        expansions += 1;
        const best = node.children[0] || null;
        const chosen = best && best.score > currentScore ? best : null;
        if (chosen) node.chosenChildId = chosen.id;
        steps.push({ node, options: node.children, chosen, expansions, frontierSize: 0 });
        if (isGoal(node.board) || !chosen) break;
        visited.add(keyOf(chosen.board));
        node = chosen;
      }

      return { root, steps };
    }

    function runBestFirst(start) {
      const root = makeNode(start, 0, "시작", null);
      const steps = [];
      const frontier = [root];
      const known = new Set([keyOf(start)]);
      let expansions = 0;

      while (frontier.length && expansions < 2000) {
        frontier.sort((a, b) => b.score - a.score || a.depth - b.depth || a.id.localeCompare(b.id));
        const node = frontier.shift();
        if (node.expanded) continue;
        node.expanded = true;
        expansions += 1;
        if (isGoal(node.board)) {
          node.status = "goal";
          steps.push({ node, options: [], chosen: null, frontier: frontier.slice(), expansions, frontierSize: frontier.length });
          break;
        }
        const options = neighbors(node.board).filter(item => !known.has(item.key));
        node.children = options.map(option => makeNode(option.board, node.depth + 1, option.move, node.id));
        node.children.forEach(child => {
          known.add(keyOf(child.board));
          frontier.push(child);
        });
        frontier.sort((a, b) => b.score - a.score || a.depth - b.depth || a.id.localeCompare(b.id));
        const chosen = frontier[0] || null;
        if (chosen && node.children.some(child => child.id === chosen.id)) node.chosenChildId = chosen.id;
        steps.push({ node, options: node.children, chosen, frontier: frontier.slice(), expansions, frontierSize: frontier.length });
      }

      return { root, steps };
    }

    function runAStar(start) {
      const root = makeNode(start, 0, "시작", null);
      const steps = [];
      const frontier = [root];
      const bestCost = new Map([[keyOf(start), root.astar]]);
      let expansions = 0;
      let sequence = 0;
      root.sequence = sequence;

      while (frontier.length && expansions < 3000) {
        frontier.sort((a, b) => a.astar - b.astar || a.sequence - b.sequence);
        const node = frontier.shift();
        if (bestCost.get(keyOf(node.board)) < node.astar) continue;
        if (node.expanded) continue;
        node.expanded = true;
        expansions += 1;
        if (isGoal(node.board)) {
          node.status = "goal";
          steps.push({ node, options: [], chosen: null, frontier: frontier.slice(), expansions, frontierSize: frontier.length });
          break;
        }

        const parentNode = node.parentId ? findNode(root, node.parentId) : null;
        const options = astarNeighbors(node.board, parentNode ? parentNode.board : null);
        node.children = options.map(option => {
          const child = makeNode(option.board, node.depth + 1, option.move, node.id);
          child.sequence = ++sequence;
          child.order = option.order;
          return child;
        }).filter(child => {
          const key = keyOf(child.board);
          const previous = bestCost.get(key);
          if (previous !== undefined && previous <= child.astar) return false;
          bestCost.set(key, child.astar);
          return true;
        });

        node.children.forEach(child => frontier.push(child));
        const activeFrontier = frontier.filter(item => bestCost.get(keyOf(item.board)) === item.astar && !item.expanded);
        activeFrontier.sort((a, b) => a.astar - b.astar || a.sequence - b.sequence);
        const chosen = activeFrontier[0] || null;
        if (chosen && node.children.some(child => child.id === chosen.id)) node.chosenChildId = chosen.id;
        steps.push({ node, options: node.children, chosen, frontier: activeFrontier.slice(), expansions, frontierSize: activeFrontier.length });
      }

      return { root, steps };
    }

    function findNode(root, id) {
      const queue = [root];
      while (queue.length) {
        const node = queue.shift();
        if (node.id === id) return node;
        queue.push(...node.children);
      }
      return null;
    }

    function renderBoard(el, board, compact = false) {
      el.innerHTML = "";
      board.forEach((value, index) => {
        const tile = document.createElement("div");
        tile.className = `tile${value === 0 ? " blank" : ""}${value !== 0 && value === GOAL[index] ? " correct" : ""}`;
        tile.textContent = value || "";
        el.appendChild(tile);
      });
      if (compact) el.classList.add("mini-puzzle");
    }

    function boardHtml(board, className = "mini-puzzle") {
      return `<div class="${className}">${board.map((value, index) => `<span class="${value === 0 ? "blank" : ""}${value !== 0 && value === GOAL[index] ? " correct" : ""}">${value || ""}</span>`).join("")}</div>`;
    }

    function evaluationText(node) {
      if (state.mode === "astar") return `f=${node.astar} · g=${node.depth} · h=${node.mismatch}`;
      return `${node.score} / 8`;
    }

    function evaluationWidth(node) {
      if (state.mode === "astar") return `${Math.max(0, Math.min(100, ((24 - node.astar) / 24) * 100))}%`;
      return `${(node.score / 8) * 100}%`;
    }

    function renderCandidates(step) {
      candidateGrid.innerHTML = "";
      if (!step) {
        reasonText.textContent = "현재 상태에서 움직일 수 있는 후보가 여기에 표시됩니다.";
        return;
      }
      if (!step.options.length && state.mode !== "best") {
        reasonText.textContent = isGoal(step.node.board) ? "목표 상태에 도달했습니다." : "더 확장할 후보가 없습니다.";
        return;
      }
      const chosen = step.chosen;
      if (state.mode === "astar") {
        reasonText.textContent = "A*는 열린 후보 전체에서 f=g+h 값이 가장 낮은 상태를 고릅니다. 바로 부모 상태로 되돌아가는 후보는 제외하고, f가 같으면 왼쪽 후보를 먼저 선택합니다.";
        candidateGrid.appendChild(candidateSection("방금 확장한 상태에서 생긴 후보", "부모 상태와 같은 되돌아가기 후보는 제외했습니다.", step.options, chosen, false, step.node.score));
        candidateGrid.appendChild(candidateSection("열린 후보 전체", "이 목록 전체에서 f 값이 가장 작은 상태가 다음 선택입니다. 같은 f 값이면 먼저 놓인 왼쪽 후보가 선택됩니다.", step.frontier || [], chosen, true, step.node.score));
        return;
      }
      if (state.mode === "best") {
        reasonText.textContent = "최상 우선 탐색은 현재 상태보다 좋아지는지만 보지 않고, 아직 탐색하지 않은 열린 후보 전체 중 평가값이 가장 높은 상태를 고릅니다.";
        candidateGrid.appendChild(candidateSection("방금 확장한 상태에서 생긴 후보", "현재 상태를 움직여 새로 발견한 상태입니다. 이 안에 다음 선택이 없을 수도 있습니다.", step.options, chosen, false, step.node.score));
        candidateGrid.appendChild(candidateSection("열린 후보 전체", "이 목록 전체가 다음 선택 후보입니다. 더 높은 값이 없어도 여기서 가장 높은 상태를 고릅니다.", step.frontier || [], chosen, true, step.node.score));
        return;
      }

      reasonText.textContent = "현재 상태보다 평가값이 높은 이웃 중 가장 좋은 상태를 고릅니다.";
      candidateGrid.appendChild(candidateSection("현재 상태의 이웃 후보", "현재 평가값보다 높은 후보가 없으면 언덕 등반 탐색은 멈춥니다.", step.options, chosen, false, step.node.score));
    }

    function candidateSection(title, note, options, chosen, useFrontierStyle, currentScore) {
      const section = document.createElement("section");
      section.className = "candidate-section";
      section.innerHTML = `<h3>${title}</h3><p class="candidate-section-note">${note}</p>`;
      const grid = document.createElement("div");
      grid.className = "candidate-grid";
      if (!options.length) {
        const empty = document.createElement("p");
        empty.className = "candidate-section-note";
        empty.textContent = "표시할 후보가 없습니다.";
        section.appendChild(empty);
        return section;
      }
      options.forEach(option => {
        const item = document.createElement("div");
        const chosenHere = chosen && chosen.id === option.id;
        const rejected = state.mode === "hill" && option.score <= currentScore;
        item.className = `candidate${chosenHere ? useFrontierStyle ? " frontier-choice" : " chosen" : ""}${rejected ? " rejected" : ""}`;
        item.innerHTML = `
          <div class="candidate-head">
            <span>${chosenHere ? "다음 선택" : "후보"} · ${option.move}</span>
            <span>${evaluationText(option)}</span>
          </div>
          ${boardHtml(option.board)}
          <div class="bar" style="--score-width:${evaluationWidth(option)}"><span></span></div>
          <div class="candidate-meta">
            ${state.mode === "astar"
              ? `<span>이동 횟수 g=${option.depth}</span><span>틀린 블록 h=${option.mismatch}</span><span>평가 함수 f=${option.astar}</span>`
              : `<span>목표와 같은 칸 ${option.score}개</span><span>다른 칸 ${option.mismatch}개</span>`}
          </div>
        `;
        grid.appendChild(item);
      });
      section.appendChild(grid);
      return section;
    }

    function renderStep(index) {
      if (!state.steps.length) {
        renderCandidates(null);
        return;
      }
      state.stepIndex = Math.max(0, Math.min(index, state.steps.length - 1));
      const step = state.steps[state.stepIndex];
      state.current = step.node.board.slice();
      renderBoard(currentBoard, state.current);
      scoreText.textContent = state.mode === "astar" ? `f=${step.node.astar}` : `${score(state.current)} / 8`;
      expandedText.textContent = step.expansions.toLocaleString("ko-KR");
      stateText.textContent = isGoal(state.current) ? "성공" : state.stepIndex === state.steps.length - 1 && !step.chosen && state.mode === "hill" ? "정지" : "탐색 중";
      message.textContent = isGoal(state.current)
        ? "목표 상태에 도달했습니다."
        : state.mode === "hill" && !step.chosen
          ? "더 좋아지는 이웃이 없어 언덕 등반 탐색이 멈췄습니다."
          : state.mode === "astar"
            ? `${state.stepIndex + 1}번째 확장 상태입니다. f=g+h가 가장 낮은 열린 후보를 고릅니다.`
          : `${state.stepIndex + 1}번째 확장 상태입니다.`;
      renderCandidates(step);
      stepBtn.disabled = state.stepIndex >= state.steps.length - 1;
    }

    function runSearch() {
      const result = state.mode === "hill"
        ? runHillClimbing(state.start)
        : state.mode === "best"
          ? runBestFirst(state.start)
          : runAStar(state.start);
      state.root = result.root;
      state.steps = result.steps;
      renderStep(0);
    }

    function setMode(mode) {
      state.mode = mode;
      const hill = mode === "hill";
      const best = mode === "best";
      hillBtn.setAttribute("aria-pressed", String(hill));
      bestBtn.setAttribute("aria-pressed", String(best));
      astarBtn.setAttribute("aria-pressed", String(mode === "astar"));
      hillBtn.classList.toggle("primary", hill);
      bestBtn.classList.toggle("primary", best);
      astarBtn.classList.toggle("primary", mode === "astar");
      message.textContent = `${hill ? "언덕 등반 탐색" : best ? "최상 우선 탐색" : "A* 탐색"}을 선택했습니다.`;
      scoreText.textContent = mode === "astar" ? `f=${astarValue(state.current, 0)}` : `${score(state.current)} / 8`;
      state.steps = [];
      state.root = null;
      stepBtn.disabled = true;
      renderCandidates(null);
    }

    function resetPuzzle() {
      let board = shuffledBoard();
      if (!isSolvable(board)) board = [1, 2, 3, 4, 0, 6, 7, 5, 8];
      state.start = board;
      state.current = board.slice();
      state.steps = [];
      state.stepIndex = 0;
      state.root = null;
      renderBoard(currentBoard, state.current);
      renderBoard(goalBoard, GOAL);
      scoreText.textContent = state.mode === "astar" ? `f=${astarValue(state.current, 0)}` : `${score(state.current)} / 8`;
      expandedText.textContent = "0";
      stateText.textContent = "대기";
      message.textContent = "탐색 방식을 선택하고 실행하세요.";
      candidateGrid.innerHTML = "";
      reasonText.textContent = "현재 상태에서 움직일 수 있는 후보가 여기에 표시됩니다.";
      stepBtn.disabled = true;
    }

    hillBtn.addEventListener("click", () => setMode("hill"));
    bestBtn.addEventListener("click", () => setMode("best"));
    astarBtn.addEventListener("click", () => setMode("astar"));
    runBtn.addEventListener("click", runSearch);
    stepBtn.addEventListener("click", () => renderStep(state.stepIndex + 1));
    resetBtn.addEventListener("click", resetPuzzle);

    resetPuzzle();
  </script>
</body>
</html>
