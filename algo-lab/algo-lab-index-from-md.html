<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Algorithm Lab</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f5f7fb;
    color: #111827;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .logo {
    width: 90px;
    max-width: 30vw;
  }

  .brand-text {
    font-size: 26px;
    font-weight: 800;
    color: #374151;
  }

  h1 {
    margin: 0 0 8px;
    text-align: center;
    font-size: 34px;
  }

  .page-desc {
    text-align: center;
    color: #6b7280;
    margin-bottom: 28px;
    line-height: 1.6;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .list-item {
    display: block;
    padding: 20px 22px;
    border-radius: 18px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .list-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
  }

  .title-line {
    display: flex;
    gap: 10px;
    align-items: baseline;
    flex-wrap: wrap;
    line-height: 1.5;
  }

  .main-title {
    font-size: 19px;
    font-weight: 800;
    color: #111827;
  }

  .sub-title {
    font-size: 13px;
    color: #6b7280;
  }

  .sub-title::before {
    content: "—";
    margin-right: 6px;
  }

  .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .tag {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    background: #eef2ff;
    color: #3730a3;
    font-weight: 600;
  }

  .empty,
  .error {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 20px;
    color: #4b5563;
    line-height: 1.7;
  }

  .copyright {
    margin-top: 30px;
    padding-top: 16px;
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    border-top: 1px solid #e5e7eb;
    line-height: 1.7;
  }

  @media (max-width: 640px) {
    h1 { font-size: 28px; }
    .main-title { font-size: 17px; }
    .sub-title { font-size: 12px; }
    .list-item { padding: 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="logo.png" class="logo" alt="Junossam 로고">
      <div class="brand-text">Junossam</div>
    </div>

    <h1 id="pageTitle">알고리즘 실습실</h1>
    <div class="page-desc" id="pageDesc">탐색과 정렬 알고리즘을 직접 만들고 비교해보는 공간</div>

    <div id="app">
      <div class="empty">목록을 불러오는 중입니다.</div>
    </div>

    <div class="copyright">
      <strong>© 2026 Junossam | 교사 강준호 · 성서고등학교</strong><br>
      본 페이지는 생성형 인공지능을 활용한 바이브 코딩 방식으로 구현하였습니다.
    </div>
  </div>

<script>
  const REPO_OWNER = "junossam";
  const REPO_NAME = "junossam.github.io";
  const REPO_BRANCH = "main";
  const FOLDER_PATH = "algo-lab";
  const RAW_MD_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/${FOLDER_PATH}/README.md`;
  const LOCAL_MD_URL = "README.md";

  function escapeHtml(text) {
    return String(text ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function parseMarkdown(md) {
    const lines = md.split(/\\r?\\n/);
    const items = [];
    let current = null;

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) continue;

      if (line.startsWith("### ")) {
        if (current && current.title && current.filename) {
          items.push(current);
        }
        current = {
          title: line.slice(4).trim(),
          filename: "",
          purpose: "",
          tags: []
        };
        continue;
      }

      if (!current) continue;

      if (line.startsWith("- 파일명:")) {
        current.filename = line.replace("- 파일명:", "").trim();
        continue;
      }

      if (line.startsWith("- 용도:")) {
        current.purpose = line.replace("- 용도:", "").trim();
        continue;
      }

      if (line.startsWith("- 태그:")) {
        current.tags = line
          .replace("- 태그:", "")
          .split(",")
          .map(v => v.trim())
          .filter(Boolean);
      }
    }

    if (current && current.title && current.filename) {
      items.push(current);
    }

    return items;
  }

  function render(items) {
    const app = document.getElementById("app");

    if (!items.length) {
      app.innerHTML = `
        <div class="empty">
          표시할 항목이 없습니다.<br>
          README.md 안에 <strong>### 제목</strong>, <strong>- 파일명:</strong>, <strong>- 용도:</strong> 형식의 블록이 있는지 확인해 주세요.
        </div>
      `;
      return;
    }

    app.innerHTML = `
      <div class="list">
        ${items.map(item => `
          <a class="list-item" href="${encodeURI(item.filename)}">
            <div class="title-line">
              <span class="main-title">${escapeHtml(item.title)}</span>
              <span class="sub-title">${escapeHtml(item.purpose || "")}</span>
            </div>

            ${item.tags.length ? `
              <div class="tags">
                ${item.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
              </div>
            ` : ""}
          </a>
        `).join("")}
      </div>
    `;
  }

  async function fetchMarkdown() {
    try {
      const rawRes = await fetch(RAW_MD_URL + `?v=${Date.now()}`, { cache: "no-store" });
      if (rawRes.ok) {
        return await rawRes.text();
      }
    } catch (e) {}

    const localRes = await fetch(LOCAL_MD_URL + `?v=${Date.now()}`, { cache: "no-store" });
    if (!localRes.ok) {
      throw new Error(`README.md를 불러오지 못했습니다. (${localRes.status})`);
    }
    return await localRes.text();
  }

  async function init() {
    const app = document.getElementById("app");

    try {
      const md = await fetchMarkdown();
      const items = parseMarkdown(md);
      render(items);
    } catch (error) {
      app.innerHTML = `
        <div class="error">
          <strong>목록을 불러오지 못했습니다.</strong><br>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }

  init();
</script>
</body>
</html>
