<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Algorithm Lab</title>

<style>
body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f5f7fb;
  color: #111827;
}

.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 20px;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.desc {
  text-align: center;
  color: #6b7280;
  margin-bottom: 30px;
}

/* 리스트 카드 */
.list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.list-item {
  display: block;
  padding: 20px 22px;
  border-radius: 18px;
  background: white;
  border: 1px solid #e5e7eb;
  text-decoration: none;
  color: inherit;
  transition: 0.2s;
}

.list-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.08);
}

.title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 6px;
}

.desc-item {
  font-size: 14px;
  color: #4b5563;
  margin-bottom: 10px;
}

.tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tag {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 999px;
  background: #eef2ff;
  color: #3730a3;
  font-weight: 600;
}

.copyright {
  margin-top: 30px;
  padding-top: 16px;
  text-align: center;
  font-size: 13px;
  color: #6b7280;
  border-top: 1px solid #e5e7eb;
}
</style>
</head>

<body>
<div class="wrap">
  <h1 id="title">알고리즘 실습실</h1>
  <div class="desc" id="desc">불러오는 중...</div>

  <div id="app"></div>

  <div class="copyright">
    <strong>© 2026 Junossam | 교사 강준호 · 성서고등학교</strong><br>
    본 페이지는 생성형 인공지능을 활용한 바이브 코딩 방식으로 구현하였습니다.
  </div>
</div>

<script>
const DATA_FILE = "README.md";

function escapeHtml(text) {
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function parseMarkdown(md) {
  const lines = md.split(/\r?\n/);
  let title = "";
  let desc = "";
  const items = [];
  let current = null;

  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;

    if (t.startsWith("# ")) {
      title = t.slice(2);
      continue;
    }

    if (t.startsWith("> ")) {
      desc = t.slice(2);
      continue;
    }

    if (t.startsWith("### ")) {
      if (current) items.push(current);
      current = { title: t.slice(4), filename: "", purpose: "", tags: [] };
      continue;
    }

    if (!current) continue;

    if (t.startsWith("- 파일명:")) {
      current.filename = t.replace("- 파일명:", "").trim();
    }

    if (t.startsWith("- 용도:")) {
      current.purpose = t.replace("- 용도:", "").trim();
    }

    if (t.startsWith("- 태그:")) {
      current.tags = t.replace("- 태그:", "").split(",").map(s => s.trim());
    }
  }

  if (current) items.push(current);

  return { title, desc, items };
}

function render(data) {
  document.getElementById("title").textContent = data.title;
  document.getElementById("desc").textContent = data.desc;

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="list">
      ${data.items.map(item => `
        <a class="list-item" href="${item.filename}">
          <div class="title">${escapeHtml(item.title)}</div>
          <div class="desc-item">${escapeHtml(item.purpose)}</div>
          <div class="tags">
            ${item.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
          </div>
        </a>
      `).join("")}
    </div>
  `;
}

fetch(DATA_FILE)
  .then(res => res.text())
  .then(md => render(parseMarkdown(md)))
  .catch(() => {
    document.getElementById("app").innerHTML = "MD 파일을 불러올 수 없습니다.";
  });
</script>

</body>
</html>
